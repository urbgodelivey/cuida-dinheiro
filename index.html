<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>Cuida Dinheiro</title><link rel="manifest" href="manifest.json"><style>:root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--primary:#16a34a;--primary-soft:#dcfce7;--danger:#dc2626;--danger-soft:#fee2e2}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}.app{max-width:720px;margin:auto;padding:16px 14px 96px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:52px;height:52px;border-radius:18px;background:linear-gradient(135deg,var(--primary),#111827);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:800}.brand h1{font-size:21px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}.gear{border:1px solid var(--border);background:var(--card);width:44px;height:44px;border-radius:14px;font-size:20px}.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.hero,.card{background:var(--card);border:1px solid var(--border)}.hero{border-radius:22px;padding:18px;margin-bottom:12px}.hero .label,.card .k{color:var(--muted);font-size:13px}.hero .money{font-size:34px;font-weight:800;margin:4px 0}.hero .sub{color:var(--muted);font-size:13px}.card{border-radius:18px;padding:14px}.card .v{font-weight:800;font-size:18px;margin-top:4px}.section{margin-top:18px}.section h2{font-size:16px;margin:0 0 10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{min-height:48px;border:0;border-radius:15px;font-weight:700;font-size:15px;padding:0 14px}.primary{background:var(--primary);color:#fff}.secondary{background:var(--primary-soft);color:var(--text);border:1px solid var(--border)}.ghost{background:var(--card);border:1px solid var(--border);color:var(--text)}.list{display:grid;gap:9px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px}.row .name{font-weight:700}.row .meta{font-size:12px;color:var(--muted);margin-top:3px}.amount.in{color:var(--primary);font-weight:800}.amount.out{color:var(--danger);font-weight:800}.empty{padding:18px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--border);border-radius:16px}dialog{border:0;border-radius:22px;padding:0;max-width:520px;width:calc(100% - 24px)}dialog::backdrop{background:#0f172a88}.modal{padding:18px;background:var(--card);color:var(--text)}.modal h3{margin:0 0 14px}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:13px;color:var(--muted)}.field input,.field select{width:100%;min-height:46px;border:1px solid var(--border);border-radius:13px;padding:0 12px;font-size:16px;background:var(--card);color:var(--text)}.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}.notice{margin-top:10px;border-radius:14px;padding:12px;background:var(--primary-soft);font-size:14px}.notice.bad{background:var(--danger-soft)}.nav{position:fixed;left:0;right:0;bottom:0;background:#ffffffee;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:5}.nav button{border:0;background:transparent;min-height:50px;font-size:12px;color:var(--muted);font-weight:700}.nav button.active{color:var(--primary)}.hidden{display:none!important}@media(min-width:640px){.g4{grid-template-columns:repeat(4,1fr)}}</style></head><body><main class="app"><header class="top"><div class="brand"><div class="logo">R$</div><div><h1>Cuida Dinheiro</h1><p>Seu dinheiro sob controle.</p></div></div><button id="settingsBtn" class="gear">⚙️</button></header><section id="homeView"><div class="hero"><div class="label">Dinheiro livre agora</div><div class="money" id="freeMoney">R$ 0,00</div><div class="sub">Já descontando as contas pendentes.</div></div><div class="grid g2 g4"><div class="card"><div class="k">Saldo</div><div class="v" id="balance"></div></div><div class="card"><div class="k">Entradas</div><div class="v" id="income"></div></div><div class="card"><div class="k">Saídas</div><div class="v" id="expense"></div></div><div class="card"><div class="k">Contas</div><div class="v" id="pending"></div></div></div><div class="section"><h2>Ações rápidas</h2><div class="actions"><button class="btn primary" id="addIncome">+ Entrada</button><button class="btn secondary" id="addExpense">− Saída</button><button class="btn ghost" id="addBill">+ Conta</button><button class="btn ghost" id="canSpend">Posso gastar?</button></div></div><div class="section"><h2>Últimas movimentações</h2><div id="recentList" class="list"></div></div></section><section id="transactionsView" class="hidden"><div class="section"><h2>Todas as movimentações</h2><div id="allList" class="list"></div></div></section><section id="billsView" class="hidden"><div class="section"><h2>Contas a pagar</h2><button class="btn primary" id="addBill2">+ Nova conta</button><div id="billsList" class="list" style="margin-top:10px"></div></div></section><section id="analysisView" class="hidden"><div class="section"><h2>Resumo</h2><div class="hero"><div class="label">Resultado atual</div><div class="money" id="resultMoney"></div><div class="sub" id="analysisText"></div></div></div></section></main><nav class="nav"><button data-view="homeView" class="active">Início</button><button data-view="transactionsView">Movimentos</button><button data-view="billsView">Contas</button><button data-view="analysisView">Resumo</button></nav><dialog id="movementDialog"><form method="dialog" class="modal" id="movementForm"><h3 id="movementTitle"></h3><input type="hidden" id="movementType"><div class="field"><label>Valor</label><input id="movementAmount" inputmode="decimal" placeholder="R$ 0,00" required></div><div class="field"><label>Categoria</label><select id="movementCategory"><option>Trabalho</option><option>Alimentação</option><option>Moradia</option><option>Moto</option><option>Combustível</option><option>Transporte</option><option>Saúde</option><option>Lazer</option><option>Outros</option></select></div><div class="field"><label>Descrição</label><input id="movementDescription" placeholder="Ex.: corrida, mercado, gasolina"></div><div class="modal-actions"><button type="button" class="btn ghost" data-close="movementDialog">Cancelar</button><button class="btn primary">Salvar</button></div></form></dialog><dialog id="billDialog"><form method="dialog" class="modal" id="billForm"><h3>Nova conta</h3><div class="field"><label>Conta</label><input id="billName" required></div><div class="field"><label>Valor</label><input id="billAmount" inputmode="decimal" required></div><div class="field"><label>Vencimento</label><input id="billDue" type="date"></div><div class="modal-actions"><button type="button" class="btn ghost" data-close="billDialog">Cancelar</button><button class="btn primary">Salvar</button></div></form></dialog><dialog id="spendDialog"><form method="dialog" class="modal" id="spendForm"><h3>Posso gastar?</h3><div class="field"><label>Quanto você quer gastar?</label><input id="spendAmount" inputmode="decimal" required></div><div id="spendResult"></div><div class="modal-actions"><button type="button" class="btn ghost" data-close="spendDialog">Fechar</button><button class="btn primary">Analisar</button></div></form></dialog><dialog id="settingsDialog"><form method="dialog" class="modal"><h3>Aparência</h3><div class="field"><label>Cor principal</label><input id="colorPicker" type="color" value="#16a34a"></div><div class="field"><label>Tema</label><select id="themeSelect"><option value="light">Claro</option><option value="dark">Escuro</option></select></div><div class="modal-actions"><button type="button" class="btn primary" data-close="settingsDialog">Pronto</button></div></form></dialog><script src="app.js"></script></body></html>
